# Alembic configuration.
#
# NOTE: keep this file pure ASCII. Alembic reads alembic.ini with the *locale*
# encoding (GBK on a Chinese Windows install), so UTF-8 comments here raise
# UnicodeDecodeError before anything else runs. Chinese explanations live in
# migrations/env.py instead, which Python reads as UTF-8.
#
# The database URL is intentionally empty: migrations/env.py reads the real DSN
# from app.config, so migrations and runtime always point at the same database.
#
# Common commands (run from the project root):
#   alembic upgrade head                       # create/upgrade schema
#   alembic downgrade -1                       # roll back one revision
#   alembic revision --autogenerate -m "msg"   # new revision after editing models.py
#   alembic current / alembic history          # inspect state

[alembic]
script_location = migrations
prepend_sys_path = .
# Timestamped filenames: lexical order == execution order
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = Asia/Shanghai

# Injected by env.py; must stay empty here.
sqlalchemy.url =

[post_write_hooks]
# Reserved: hook black/ruff here if you want generated revisions auto-formatted.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
